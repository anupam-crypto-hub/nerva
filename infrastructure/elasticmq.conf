include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  notification-module-event-processing {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "notification-module-event-processing-dlq"
      maxReceiveCount = 3
    }
  }

  notification-module-event-processing-dlq {
    defaultVisibilityTimeout = 30 seconds
  }

  notification-module-workflow-execution {
    defaultVisibilityTimeout = 60 seconds
    delay = 0 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "notification-module-workflow-execution-dlq"
      maxReceiveCount = 3
    }
  }

  notification-module-workflow-execution-dlq {
    defaultVisibilityTimeout = 60 seconds
  }

  notification-module-communication {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "notification-module-communication-dlq"
      maxReceiveCount = 3
    }
  }

  notification-module-communication-dlq {
    defaultVisibilityTimeout = 30 seconds
  }

  notification-module-conversation-processing {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "notification-module-conversation-processing-dlq"
      maxReceiveCount = 3
    }
  }

  notification-module-conversation-processing-dlq {
    defaultVisibilityTimeout = 30 seconds
  }

  notification-module-ai-processing {
    defaultVisibilityTimeout = 60 seconds
    delay = 0 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "notification-module-ai-processing-dlq"
      maxReceiveCount = 3
    }
  }

  notification-module-ai-processing-dlq {
    defaultVisibilityTimeout = 60 seconds
  }

  notification-module-webhook-delivery {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "notification-module-webhook-delivery-dlq"
      maxReceiveCount = 5
    }
  }

  notification-module-webhook-delivery-dlq {
    defaultVisibilityTimeout = 30 seconds
  }
}
